<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrayCC Admin — Spin Hub</title>
    <meta name="robots" content="noindex,nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            clubPurple: '#581C87', clubPurpleDark: '#3B0764',
            clubBlue: '#2563EB', clubBlueDark: '#1D4ED8'
        }}}};
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .pace-badge-Red { background-color: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
        .pace-badge-Orange { background-color: #FFEDD5; color: #9A3412; border: 1px solid #FDBA74; }
        .pace-badge-Yellow { background-color: #FEF9C3; color: #854D0E; border: 1px solid #FDE047; }
        .pace-badge-Green { background-color: #DCFCE7; color: #166534; border: 1px solid #86EFAC; }
        .pace-badge-Blue { background-color: #DBEAFE; color: #1E40AF; border: 1px solid #93C5FD; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-clubPurple text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-lg text-clubPurple">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold">BrayCC Admin</h1>
                    <p class="text-xs text-purple-200">Full control panel — spins, ICE, subscriptions</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="/" class="text-xs bg-purple-800 hover:bg-purple-700 px-3 py-2 rounded-lg font-bold border border-purple-600 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Site
                </a>
                <button onclick="logout()" class="text-xs bg-red-700 hover:bg-red-800 px-3 py-2 rounded-lg font-bold">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">

        <div id="login-view" class="max-w-md mx-auto mt-16 bg-white rounded-xl shadow-lg border border-slate-200 p-6">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock text-clubPurple text-3xl mb-2"></i>
                <h2 class="text-xl font-extrabold text-slate-900">Admin Login</h2>
                <p class="text-xs text-slate-500 mt-1">Enter the admin token to continue.</p>
            </div>
            <form onsubmit="event.preventDefault(); login();" class="space-y-3">
                <input type="password" id="token-input" placeholder="Admin token" required
                       class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-clubPurple focus:outline-none">
                <button type="submit" class="w-full bg-clubPurple hover:bg-clubPurpleDark text-white font-bold rounded-lg py-2.5 transition">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
                </button>
                <p id="login-error" class="text-xs text-red-600 text-center hidden"></p>
            </form>
        </div>

        <div id="admin-view" class="hidden space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-bold text-slate-500 uppercase">Total Spins</div>
                    <div id="stat-spins" class="text-2xl font-black text-clubPurple mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-bold text-slate-500 uppercase">Total Committed Riders</div>
                    <div id="stat-riders" class="text-2xl font-black text-emerald-600 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-bold text-slate-500 uppercase">Push Subscribers</div>
                    <div id="stat-subs" class="text-2xl font-black text-clubBlue mt-1">0</div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
                <div class="flex-1">
                    <input type="text" id="admin-search" oninput="renderAdmin()" placeholder="Search spins by title, author, location…"
                           class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-clubPurple focus:outline-none">
                </div>
                <div class="flex gap-2">
                    <button onclick="loadData()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-300 transition">
                        <i class="fa-solid fa-rotate mr-1"></i> Refresh
                    </button>
                    <button onclick="toggleSubs()" class="px-4 py-2.5 bg-clubBlue hover:bg-clubBlueDark text-white font-semibold text-sm rounded-lg transition">
                        <i class="fa-solid fa-bell mr-1"></i> <span id="subs-btn-label">View Subscribers</span>
                    </button>
                </div>
            </div>

            <div id="subs-panel" class="hidden bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="bg-slate-100 px-4 py-2 border-b font-bold text-slate-700 text-sm flex items-center justify-between">
                    <span><i class="fa-solid fa-bell text-clubBlue mr-2"></i>Push Subscribers</span>
                    <button onclick="toggleSubs()" class="text-slate-500 hover:text-slate-800 text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="subs-body" class="p-4 text-xs space-y-2"></div>
            </div>

            <div id="admin-spins" class="space-y-4"></div>
        </div>
    </main>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl max-w-3xl w-full my-8">
            <div class="bg-clubPurple p-4 text-white flex items-center justify-between rounded-t-xl">
                <h3 class="font-extrabold"><i class="fa-solid fa-pen-to-square mr-2"></i>Edit Spin</h3>
                <button onclick="closeEditModal()" class="text-white/80 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="edit-form" onsubmit="event.preventDefault(); saveEdit();" class="p-5 space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Title</label>
                        <input type="text" id="edit-title" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Spin Type</label>
                        <input type="text" id="edit-type" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Date</label>
                        <input type="date" id="edit-date" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Time</label>
                        <input type="time" id="edit-time" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Location</label>
                        <input type="text" id="edit-location" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Distance (km)</label>
                        <input type="number" id="edit-distance" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pace</label>
                        <select id="edit-pace" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                            <option value="Red">Red — Leisurely</option>
                            <option value="Orange">Orange — Moderate</option>
                            <option value="Yellow">Yellow — Steady</option>
                            <option value="Green">Green — Brisk</option>
                            <option value="Blue">Blue — Fastest</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Min Riders</label>
                        <input type="number" id="edit-minriders" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Weather Policy</label>
                        <select id="edit-weather" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                            <option value="All-Weather">All-Weather</option>
                            <option value="Fair-Weather Only">Fair-Weather Only</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Author</label>
                        <input type="text" id="edit-author" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Phone</label>
                        <input type="tel" id="edit-phone" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Map Link</label>
                        <input type="url" id="edit-maplink" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="inline-flex items-center space-x-2">
                            <input type="checkbox" id="edit-mudguards" class="w-4 h-4">
                            <span class="text-xs font-bold text-slate-800">Mudguards Required</span>
                        </label>
                    </div>
                </div>

                <div class="border-t pt-4">
                    <h4 class="font-bold text-slate-800 text-sm mb-2"><i class="fa-solid fa-users mr-1 text-clubPurple"></i>Committed Riders &amp; ICE</h4>
                    <div id="edit-riders" class="space-y-2"></div>
                </div>

                <div class="flex justify-between pt-3 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-sm">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-clubBlue hover:bg-clubBlueDark text-white font-bold rounded-lg text-sm">
                        <i class="fa-solid fa-save mr-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
